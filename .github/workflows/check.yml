name: Frontend and Windows checks

on:
  push:
    branches: [main]
    paths: ["frontend/**", "native/**", "installer/**", "scripts/**", "version.json", ".github/workflows/check.yml"]
  pull_request:
    paths: ["frontend/**", "native/**", "installer/**", "scripts/**", "version.json", ".github/workflows/check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir frontend check
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend build:demo
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - run: ./scripts/build.ps1
        shell: pwsh
      - run: ./scripts/test.ps1
        shell: pwsh
      - name: Test worker disconnection and shutdown
        run: ./scripts/test-worker-connection.ps1
        shell: pwsh
      - name: Build Windows installer
        run: ./scripts/build-installer.ps1
        shell: pwsh
      - name: Test update shutdown
        run: |
          ./scripts/ensure-ci-webview.ps1
          foreach ($scenario in @('Ready','Refuse','WrongPath','Silent','Idle')) {
            ./scripts/test-installer-update.ps1 -Scenario $scenario
          }
          ./scripts/test-installer-update.ps1 -Scenario Ready -Tray
          ./scripts/test-installer-update.ps1 -Scenario Ready -Legacy
          foreach ($title in @('Older','Legacy')) {
            ./scripts/test-installer-update.ps1 -Scenario Ready -Legacy -TitleVersion $title
          }
        shell: pwsh
      - name: Test isolated Inno installation and uninstall
        run: ./scripts/test-installer.ps1
        shell: pwsh
      - name: Test custom native interface and upgrade recovery
        run: ./installer/inno/test-custom.ps1 -PayloadDirectory artifacts/app -Version ((Get-Content version.json -Raw | ConvertFrom-Json).version)
        shell: pwsh
