name: Frontend and Windows checks

on:
  push:
    branches: [main]
    paths: ["frontend/**", "native/**", "scripts/**", "version.json", ".github/workflows/check.yml"]
  pull_request:
    paths: ["frontend/**", "native/**", "scripts/**", "version.json", ".github/workflows/check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir frontend check
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend build:demo
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - run: ./scripts/build.ps1
        shell: pwsh
      - run: ./scripts/test.ps1
        shell: pwsh
