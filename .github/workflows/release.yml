name: Publish verified Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-windows-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - name: Build and test application
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/test.ps1
          ./scripts/test-worker-connection.ps1
          ./scripts/build-installer.ps1
          ./scripts/ensure-ci-webview.ps1
      - name: Validate isolated installation and recovery
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          ./installer/inno/test.ps1 -PayloadDirectory artifacts/app -Version $version
          ./installer/inno/test-custom.ps1 -PayloadDirectory artifacts/app -Version $version
      - name: Publish and retain the latest version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $prefix = "dist/FanController-v$version-windows-x64"
          git archive --format=zip --prefix=FanController/ -o "dist/FanController-v$version-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $files = @("$prefix-setup.exe", "$prefix-setup.exe.sha256", "$prefix-setup.exe.build.json", "$prefix.zip", "$prefix.zip.sha256", "dist/FanController-v$version-Source.zip")
          ./scripts/publish-verified-release.ps1 -Version $version -Title "FanController $version" -NotesFile "docs/releases/v$version.md" -Files $files -KeepLatestOnly
